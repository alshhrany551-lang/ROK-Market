{% extends 'base.html' %}{% block content %}<section class="section narrow"><h1>{% if item %}Edit ROK-{{'%04d'|format(item.id)}}{% else %}<span data-ar="إضافة حساب" data-en="Add account">إضافة حساب</span>{% endif %}</h1><form method="post" enctype="multipart/form-data" class="card"><input type="hidden" name="csrf" value="{{csrf}}"><label>Title</label><input name="title" required maxlength="120" value="{{item.title if item else ''}}"><label>Power</label><input name="power" value="{{item.power if item else ''}}"><label>VIP</label><input name="vip" value="{{item.vip if item else ''}}"><label>Kingdom</label><input name="kingdom" value="{{item.kingdom if item else ''}}"><label>Seller price USD (5% added automatically)</label><input type="number" min="0.01" step="0.01" name="price" required value="{{item.price if item else ''}}"><label>Description / specs</label><textarea name="description" rows="6">{{item.description if item else ''}}</textarea><label>Upload account photos (up to 8 JPEG/PNG/WebP at a time)</label><input type="file" name="photos" multiple accept="image/jpeg,image/png,image/webp">{% if item %}<label>Status</label><select name="status">{% for s in ['available','reserved','sold'] %}<option value="{{s}}" {% if s==item.status %}selected{% endif %}>{{s}}</option>{% endfor %}</select>{% endif %}<button class="btn primary">Save listing</button></form>{% if item and photos %}<div class="gallery">{% for photo in photos %}<div class="card"><img style="max-width:160px;max-height:120px" src="{{url_for('static',filename='uploads/'+photo.filename)}}" alt="Listing photo"><form method="post" action="{{url_for('delete_listing_image',lid=item.id,iid=photo.id)}}"><input type="hidden" name="csrf" value="{{csrf}}"><button class="btn danger" type="submit">Remove photo</button></form></div>{% endfor %}</div>{% endif %}{% if item %}<form method="post" action="{{url_for('delete_listing',lid=item.id)}}" onsubmit="return confirm('Delete listing?')"><input type="hidden" name="csrf" value="{{csrf}}"><button class="btn danger">Delete (only without orders)</button></form>{% endif %}</section>{% endblock %}
