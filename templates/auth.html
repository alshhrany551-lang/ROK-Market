{% extends 'base.html' %}{% block content %}<section class="auth card"><h1>{% if register %}<span data-ar="إنشاء حساب" data-en="Create account">إنشاء حساب</span>{% else %}<span data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</span>{% endif %}</h1><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label><input name="email" type="email" required autocomplete="email"><label data-ar="كلمة المرور" data-en="Password">كلمة المرور</label><input name="password" type="password" minlength="10" required autocomplete="{% if register %}new-password{% else %}current-password{% endif %}">{% if register %}<label class="check"><input type="checkbox" name="agree" required><span><span data-ar="أوافق على" data-en="I accept">أوافق على</span> <a href="/terms" data-ar="الشروط والأحكام" data-en="Terms">الشروط والأحكام</a> <span data-ar="و" data-en="and">و</span> <a href="/privacy" data-ar="سياسة الخصوصية" data-en="Privacy Policy">سياسة الخصوصية</a></span></label>{% endif %}<button class="btn primary wide">{% if register %}<span data-ar="إنشاء حساب" data-en="Register">إنشاء حساب</span>{% else %}<span data-ar="دخول" data-en="Login">دخول</span>{% endif %}</button></form><p>{% if register %}<a href="/login" data-ar="عندك حساب؟ سجل دخول" data-en="Already registered? Sign in">عندك حساب؟ سجل دخول</a>{% else %}<a href="/register" data-ar="ما عندك حساب؟ سجّل الآن" data-en="New here? Register">ما عندك حساب؟ سجّل الآن</a>{% endif %}</p></section>{% endblock %}
