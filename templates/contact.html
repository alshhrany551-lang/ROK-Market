{% extends 'base.html' %}{% block content %}<section class="section narrow"><h1 data-ar="تواصل معنا" data-en="Contact us">تواصل معنا</h1><form method="post" class="card"><input type="hidden" name="csrf" value="{{csrf}}"><label data-ar="رسالتك" data-en="Your message">رسالتك</label><textarea name="body" rows="5" required maxlength="3000"></textarea><button class="btn primary" data-ar="إرسال" data-en="Send">إرسال</button></form><h2 data-ar="رسائلك" data-en="Your messages">رسائلك</h2>{% for r in rows %}<article class="card"><p>{{r.body}}</p>{% if r.reply %}<p class="alert">{{r.reply}}</p>{% else %}<p class="muted" data-ar="بانتظار الرد" data-en="Awaiting reply">بانتظار الرد</p>{% endif %}</article>{% endfor %}</section>{% endblock %}
