{% extends 'base.html' %}{% block content %}<section class="section"><h1 data-ar="طلباتي وعروضي" data-en="My requests and offers">طلباتي وعروضي</h1><div class="stack">{% for o in orders %}<a class="card line" href="{{url_for('order_detail',oid=o.id)}}"><div><b>#{{o.id}} · ROK-{{'%04d'|format(o.listing_ref)}} · {{o.title}}</b><p class="muted">{{o.kind}} · {{o.created_at}}</p></div><div><span class="status">{{o.status}}</span><strong data-usd="{{o.amount}}">${{'%.2f'|format(o.amount)}}</strong></div></a>{% else %}<p data-ar="ما عندك طلبات حتى الآن." data-en="No requests yet.">ما عندك طلبات حتى الآن.</p>{% endfor %}</div></section>{% endblock %}
